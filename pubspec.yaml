name: meterunit
description: MeterPro - Smart Electricity Meter & Bill Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  fl_chart: ^1.2.0
  intl: ^0.19.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  http: ^1.2.2
  google_mlkit_commons: ^0.12.0
  google_mlkit_text_recognition: ^0.16.0
  camera: ^0.12.0+2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  image: ^4.3.0
  path_provider: ^2.1.4
  flutter_dotenv: ^6.0.1
  package_info_plus: ^8.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#14161a"
    theme_color: "#ffb020"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
