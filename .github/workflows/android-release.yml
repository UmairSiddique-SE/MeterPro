name: Publish Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Verify signed APK and version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          test "$tag_version" = "$app_version"
          test -s public/MeterPro.apk
          sha256sum public/MeterPro.apk

      - name: Update version.json on main branch
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin main
          git switch -C main origin/main
          cat > version.json << EOF
          {
            "latest_version": "$version",
            "download_url": "https://github.com/UmairSiddique-SE/MeterPro/releases/latest/download/MeterPro.apk",
            "release_notes": "MeterPro $version includes reliable reminders and update improvements.",
            "force_update": false
          }
          EOF
          git add version.json
          git commit -m "chore: publish version.json for $version [skip ci]" || echo "Nothing to commit"
          git push origin main

      - name: Create GitHub release with signed APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: public/MeterPro.apk
